<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الظهور المميّز | Survsta</title>
<meta name="description" content="الظهور المميّز">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=2.4">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=2.4"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("provider", "p-ads.html", "الظهور المميّز", `<a href="p-dashboard.html">بوابة المزوّد</a> / <b>الظهور المميّز</b>`);

setContent(`
<div class="pagehead"><div><h2>الظهور المميّز والإعلانات</h2>
  <p>الظهور المدفوع يُوسَم دائمًا بشارة «مميّز» ولا يلغي معايير الصلة والتقييم والتوثيق في الترتيب.</p></div>
  <button class="btn btn-org" onclick="campForm()">＋ حملة جديدة</button></div>

<div class="grid g4" style="margin-bottom:16px">
  ${kpi("حملات نشطة","1","","flat","📣")}
  ${kpi("ظهور إعلاني","4,120","▲ 12%","up","👁️")}
  ${kpi("نقرات","286","CTR 6.9%","up","🖱️")}
  ${kpi("طلبات من الحملات","9","25% من إجمالي طلباتك","up","📥")}
</div>

<div class="card"><h3>حملاتك</h3>
 <div style="margin-top:14px">${table(["الحملة","النوع","الاستهداف","المدة","ظهور","نقرات","طلبات","الحالة",""],
  [["ملف مميّز — الإسكندرية","ملف مميّز","مكاتب مساحة • الإسكندرية","01/09 — 30/09","3,240","221","7","منشور"],
   ["إبراز Leica TS16","جهاز مميّز","Total Station • إيجار","03/09 — 17/09","880","65","2","قيد المراجعة"]]
  .map(r=>[`<b>${r[0]}</b>`,`<span class="chip pur">${r[1]}</span>`,`<span class="muted">${r[2]}</span>`,r[3],r[4],r[5],r[6],st(r[7]),
   `<div class="acts"><button class="btn btn-soft btn-sm" onclick="campForm('${r[0]}')">تعديل</button>
    <button class="btn btn-err btn-sm" onclick="toast('تم إيقاف الحملة')">إيقاف</button></div>`]))}</div>
</div>

<div class="card" style="margin-top:16px"><h3>خيارات الظهور المتاحة</h3>
 <div class="grid g4" style="margin-top:14px">
 ${[["⭐","ملف مميّز","ظهور أعلى داخل نتائج فئتك ونطاقك الجغرافي مع شارة واضحة.","متاح"],
    ["📡","جهاز مميّز","إبراز جهاز محدد أعلى نتائج سوق الأجهزة في فئته.","متاح"],
    ["🏠","بانر الصفحة الرئيسية","مساحة إعلانية في الصفحة الرئيسية — عدد محدود شهريًا.","قائمة انتظار"],
    ["🗺️","إبراز على الخريطة","علامة مميّزة داخل مستكشف الخريطة في نطاقك.","قريبًا"]]
  .map(([i,t,d,s])=>`<div class="card" style="background:#f9fcfd"><div style="font-size:24px">${i}</div>
    <b style="display:block;margin-top:8px">${t}</b><p class="muted" style="margin-top:6px">${d}</p>
    <div style="margin-top:10px">${st(s==="متاح"?"نشط":s==="قائمة انتظار"?"قيد المراجعة":"مسودة")}</div>
    <button class="btn btn-soft btn-sm btn-block" style="margin-top:10px" ${s==="قريبًا"?"disabled":""} onclick="campForm()">${s==="متاح"?"ابدأ":"انضم للقائمة"}</button></div>`).join("")}</div>
</div>

<div class="notice cy" style="margin-top:16px">الظهور الأساسي في الدليل والبحث <b>مجاني بالكامل</b>. الحملات المدفوعة اختيارية تمامًا ولا تؤثر على تقييمك أو شارات التوثيق.</div>
`);
function campForm(t){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>${t?"تعديل حملة":"إنشاء حملة ظهور"}</h3>
  <div class="formgrid" style="margin-top:14px">
   <div class="field"><label>اسم الحملة *</label><input value="${t||""}"></div>
   <div class="field"><label>نوع الظهور *</label><select><option>ملف مميّز</option><option>جهاز مميّز</option><option>بانر الصفحة الرئيسية</option></select></div>
   <div class="field"><label>الاستهداف الجغرافي</label><select><option>الإسكندرية</option><option>الإسكندرية + البحيرة</option><option>كل محافظات التغطية</option></select></div>
   <div class="field"><label>الفئة المستهدفة</label><select><option>مكاتب مساحة</option><option>Total Station</option><option>GNSS / RTK</option></select></div>
   <div class="field"><label>تاريخ البدء</label><input type="date"></div>
   <div class="field"><label>تاريخ الانتهاء</label><input type="date"></div>
  </div>
  <div class="notice" style="margin-top:14px">تتم مراجعة وتفعيل الحملات الإعلانية من خلال إدارة المنصة خلال 24 ساعة عمل.</div>
  <button class="btn btn-org btn-block" style="margin-top:14px" onclick="closeModal();toast('تم إرسال الحملة للمراجعة')">إرسال للمراجعة</button>`);
}

</script>
</body>
</html>
