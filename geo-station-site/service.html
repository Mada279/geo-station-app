<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل الخدمة | Survsta</title>
<meta name="description" content="تفاصيل الخدمة المساحية والجهات المقدّمة لها.">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Platform — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/style.css?v=2.7">
</head>
<body>
<main id="main">
<section class="sec tight"><div class="wrap">
  <div class="muted" id="crumb"></div>
  <div class="layout rev" style="margin-top:16px"><div id="body"></div><aside id="aside"></aside></div>
  <div class="sechead" style="margin-top:44px"><div><h2 id="ph">الجهات المقدّمة لهذه الخدمة</h2></div>
    <a href="providers.html" class="btn btn-soft">كل الجهات ←</a></div>
  <div class="grid g3" id="provs"></div>
</div></section><div id="cta"></div>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js?v=2.7"></script>
<script>
mountShell("services.html");

const s = SERVICES.find(x=>x.slug===qs("slug")) || SERVICES[0];
document.title = s.t + " | Survsta";
$("#crumb").innerHTML = `<a href="index.html">الرئيسية</a> / <a href="services.html">الخدمات</a> / <b>${s.t}</b>`;
$("#body").innerHTML = `
 <div class="panel"><img src="${s.img}" style="width:100%;height:300px;object-fit:cover;border-radius:14px" alt="${s.t}">
   <div class="rowf" style="margin-top:16px"><div class="ico">${s.icon}</div><div><h1 style="font-size:27px">${s.t}</h1><div class="muted">${s.cat}</div></div></div>
   <p style="margin-top:12px;color:var(--ink2);font-size:15.5px">${s.d}</p>
   <div class="sep"></div>
   <h3 style="font-size:19px">المخرجات المتوقعة</h3>
   <div class="grid g2" style="margin-top:12px">
     ${["تقرير فني موقّع من الجهة المنفّذة","ملفات CAD / DWG قابلة للتعديل","إحداثيات النقاط بصيغة رقمية","خرائط مطبوعة بالمقياس المطلوب"]
      .map(x=>`<div class="card" style="padding:13px"><div class="rowf"><span class="chip ok">✔</span><b style="font-size:14.5px">${x}</b></div></div>`).join("")}</div>
   <div class="sep"></div>
   <h3 style="font-size:19px">ما الذي يؤثر في السعر والمدة؟</h3>
   <ul style="margin-top:10px;color:var(--ink2)"><li>مساحة الموقع وطبيعة الأرض وصعوبة الوصول</li><li>دقة المخرجات المطلوبة ومقياس الرسم</li>
     <li>عدد الزيارات الميدانية والمدة الزمنية</li><li>الموقع الجغرافي وبُعد الجهة المنفّذة</li></ul>
   <div class="notice cy" style="margin-top:16px">Survsta لا تحدد الأسعار ولا تتدخل في التعاقد؛ الأسعار تُتفق عليها مباشرة مع الجهة المنفّذة.</div>
 </div>`;
$("#aside").innerHTML = `<div class="panel sticky"><h3 style="font-size:18px">اطلب هذه الخدمة</h3>
  <p class="muted" style="margin-top:6px">أرسل تفاصيل موقعك ومتطلباتك، وسنوجّهها للجهات المؤهلة في نطاقك.</p>
  <button class="btn btn-org btn-block btn-lg" style="margin-top:12px" onclick="openModal('need')">أضف احتياجك</button>
  <div class="sep"></div>
  <table class="spec"><tbody><tr><th>التصنيف</th><td>${s.cat}</td></tr>
   <tr><th>جهات مقدّمة</th><td>${s.n} جهة</td></tr>
   <tr><th>المحافظات المغطّاة</th><td>الإسكندرية، القاهرة، الجيزة والمزيد</td></tr></tbody></table></div>`;
$("#provs").innerHTML = PROVIDERS.slice(0,3).map(providerCard).join("");
$("#cta").innerHTML=ctaBand();
</script>
</body>
</html>
