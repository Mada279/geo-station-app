<script src="assets/js/i18n.js"></script>

<script src="assets/js/store.js"></script>

<script src="assets/js/crud.js"></script>
<script>
mountPortal("admin", "a-audit.html", "سجل التدقيق", `<a href="a-dashboard.html">لوحة الإدارة</a> / <b>سجل التدقيق</b>`);

setContent(`
<div class="pagehead"><div><h2>سجل التدقيق</h2>
  <p>كل إجراء إداري مسجَّل بالفاعل والكيان والقيمة قبل وبعد والزمن — غير قابل للتعديل أو الحذف.</p></div>
  <button class="btn btn-soft" onclick="toast('⬇ تم تصدير السجل — العملية نفسها مُسجَّلة')">⬇ تصدير السجل</button></div>

<div class="grid g4" style="margin-bottom:16px">
  ${kpi("أحداث اليوم","47","","flat","📜")}
  ${kpi("قرارات اعتماد/رفض","18","","flat","⚖️")}
  ${kpi("تغييرات صلاحيات","2","تحتاج انتباه","dn","🔑")}
  ${kpi("عمليات تصدير بيانات","3","كلها مُصرّح بها","flat","⬇️")}
</div>

<div class="toolbar"><input placeholder="بحث بالكيان أو المستخدم…" style="min-width:210px">
 <select><option>كل المستخدمين</option><option>admin@survsta.com</option><option>ops@survsta.com</option><option>data@survsta.com</option><option>support@survsta.com</option></select>
 <select><option>كل الإجراءات</option><option>اعتماد</option><option>رفض</option><option>طلب تعديلات</option><option>منح شارة</option><option>تعديل إعدادات</option><option>تصدير</option></select>
 <select><option>كل الكيانات</option><option>providers</option><option>equipment</option><option>reviews</option><option>leads</option><option>settings</option></select>
 <input type="date"><div style="flex:1"></div><span class="muted">${A_AUDIT.length*3} حدث</span></div>

${table(["الوقت","الفاعل","الدور","الإجراء","الكيان","قبل","بعد","IP"],
 A_AUDIT.concat(A_AUDIT).concat(A_AUDIT).map(a=>[`<span class="muted">${a.t}</span>`,`<b>${a.actor}</b>`,
   `<span class="chip ${a.role==="مدير النظام"?"pur":"cy"}">${a.role}</span>`,a.act,`<code>${a.ent}</code>`,
   `<span class="muted">${a.before}</span>`,`<span class="chip ok">${a.after}</span>`,`<code>${a.ip}</code>`]))}

<div class="notice" style="margin-top:16px">سجل التدقيق غير قابل للتعديل أو الحذف من داخل المنصة. يُحتفظ بالسجلات وفق سياسة الاحتفاظ المعتمدة، وتُخزَّن عناوين IP بصيغة مُجزّأة (hash) حفاظًا على الخصوصية.</div>
`);

</script>
