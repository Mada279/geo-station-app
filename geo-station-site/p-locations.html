<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المواقع والتغطية | Survsta</title>
<meta name="description" content="المواقع والتغطية">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — Concept, UX/UI & Platform Architecture by Eng. Mohamed Farag — CoreviaZone -->
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("provider", "p-locations.html", "المواقع والتغطية", `<a href="p-dashboard.html">بوابة المزوّد</a> / <b>المواقع والتغطية</b>`);

setContent(`
<div class="pagehead"><div><h2>المواقع ونطاق التغطية</h2>
  <p>الموقع بُعد أساسي في ترتيب النتائج — حدّد مقارك ونطاق خدمتك بدقة لتصلك طلبات مناسبة.</p></div>
  <button class="btn btn-pri" onclick="locForm()">＋ إضافة موقع</button></div>

<div class="split">
 <div>
  ${[["المقر الرئيسي","سموحة، الإسكندرية","31.2156, 29.9553","60 كم",true],
     ["فرع العجمي","العجمي، الإسكندرية","31.0912, 29.7684","35 كم",false]]
   .map(([t,addr,coord,rad,main])=>`<div class="card" style="margin-bottom:14px">
    <div class="rowb"><div><h3>${t} ${main?'<span class="chip cy">رئيسي</span>':""}</h3>
      <div class="muted" style="margin-top:5px">📍 ${addr}</div>
      <div class="muted">الإحداثيات: <code>${coord}</code> • نطاق الخدمة: ${rad}</div></div>
     <div class="acts"><button class="btn btn-soft btn-sm" onclick="locForm('${t}')">تعديل</button>
       ${!main?`<button class="btn btn-err btn-sm" onclick="toast('تم حذف الموقع')">حذف</button>`:""}</div></div>
    <div style="margin-top:12px;height:150px;border-radius:11px;border:1px solid var(--bd);background:linear-gradient(150deg,#dbeaea,#eef5f0);position:relative;overflow:hidden">
      <div style="position:absolute;inset:-20px;background:repeating-linear-gradient(18deg,transparent 0 26px,#c0d5d6 27px 28px),repeating-linear-gradient(108deg,transparent 0 40px,#cadcd9 41px 42px);opacity:.7"></div>
      <div style="position:absolute;top:50%;inset-inline-end:48%;transform:translate(50%,-50%);background:var(--navy2);color:#fff;border:3px solid #fff;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700">${t}</div></div>
   </div>`).join("")}

  <div class="card"><h3>المحافظات التي تخدمها</h3>
   <p class="muted" style="margin-top:6px">تُستخدم في تصفية النتائج وفي توجيه طلبات الاحتياج.</p>
   <div style="margin-top:12px">${["الإسكندرية","البحيرة","مطروح","القاهرة","الجيزة","المنوفية","الدقهلية","القليوبية"]
     .map((g,i)=>`<label class="check" style="display:inline-flex;margin-inline-end:18px"><input type="checkbox" ${i<3?"checked":""}> ${g}</label>`).join("")}</div>
   <button class="btn btn-pri btn-sm" style="margin-top:14px" onclick="toast('تم حفظ نطاق التغطية')">حفظ التغطية</button>
  </div>
 </div>

 <aside class="sticky">
  <div class="card"><h3>أثر التغطية على أدائك</h3>
   <div style="margin-top:12px">${[["ظهور في الإسكندرية",78],["ظهور في البحيرة",34],["ظهور في مطروح",12]].map(([t,v])=>barRow(t,v,100)).join("")}</div>
   <div class="sep"></div>
   <div class="notice cy">توسيع نطاق الخدمة يزيد الظهور، لكن الطلبات البعيدة قد تكون أقل جدوى. اضبط النطاق بما يناسب قدرتك الفعلية على التنقل.</div>
  </div>
  <div class="card" style="margin-top:14px"><h3>مواعيد العمل</h3>
   <div style="margin-top:12px">${[["السبت — الخميس","9:00 ص — 5:00 م"],["الجمعة","مغلق"]]
    .map(([d,h])=>`<div class="rowb" style="padding:8px 0;border-bottom:1px solid var(--bd)"><b style="font-size:13.5px">${d}</b><span class="muted">${h}</span></div>`).join("")}</div>
   <label class="check" style="margin-top:12px"><input type="checkbox" checked> أستقبل طلبات طارئة خارج المواعيد</label>
   <button class="btn btn-soft btn-block btn-sm" style="margin-top:12px" onclick="toast('تم حفظ المواعيد')">حفظ</button>
  </div>
 </aside>
</div>
`);
function locForm(t){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>${t?"تعديل موقع":"إضافة موقع"}</h3>
  <div class="formgrid" style="margin-top:14px">
   <div class="field"><label>اسم الموقع *</label><input value="${t||""}" placeholder="المقر الرئيسي / فرع…"></div>
   <div class="field"><label>المحافظة *</label><select><option>الإسكندرية</option><option>القاهرة</option><option>الجيزة</option><option>البحيرة</option></select></div>
   <div class="field"><label>المدينة / الحي *</label><input></div>
   <div class="field"><label>نصف قطر نطاق الخدمة (كم) *</label><input value="60"></div>
   <div class="field full"><label>العنوان التفصيلي</label><input></div>
   <div class="field"><label>خط العرض (Latitude)</label><input placeholder="31.2156"></div>
   <div class="field"><label>خط الطول (Longitude)</label><input placeholder="29.9553"></div>
   <div class="field full"><label class="check"><input type="checkbox"> تعيين كمقر رئيسي</label></div>
  </div>
  <button class="btn btn-pri btn-block" style="margin-top:14px" onclick="closeModal();toast('تم حفظ الموقع')">حفظ الموقع</button>`);
}

</script>
</body>
</html>
