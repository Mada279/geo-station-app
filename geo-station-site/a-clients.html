<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة العملاء | Survsta</title>
<meta name="description" content="إدارة العملاء">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=3.5">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=3.5"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("admin", "a-clients.html", "إدارة العملاء", `<a href="a-dashboard.html">لوحة الإدارة</a> / <b>العملاء</b>`);

const COLL="clients";
setContent(`
<div class="pagehead"><div><h2>إدارة العملاء</h2>
  <p>كل الجهات والأفراد الطالبين للخدمة — إضافة وتعديل ودمج التكرار وأرشفة، مع تسجيل كامل في سجل التدقيق.</p></div>
  <div class="rowf">${CRUD.addBtn("clients","إضافة عميل")}
   <button class="btn btn-soft" onclick="GS.exportCSV('clients')&&toast('⬇ تم تصدير ملف CSV')">⬇ تصدير CSV</button></div></div>

<div class="grid g4" style="margin-bottom:16px">
  <div class="kpi"><div class="ic">👥</div><div><div class="lab">عملاء نشطون</div><div class="n" id="uActive">0</div></div></div>
  <div class="kpi"><div class="ic">📦</div><div><div class="lab">مؤرشفون</div><div class="n" id="uArch">0</div></div></div>
  ${kpi("إجمالي الطلبات","38","▲ 12%","up","📥")}
  <div class="card" style="padding:14px"><div class="rowb"><span class="muted" style="font-size:12.5px">مساحة التخزين</span>
    <b id="stlab" style="font-size:12.5px">—</b></div>
    <div class="storagebar" id="stbar" style="margin-top:8px"><i style="width:0%"></i></div>
    <small class="hint">البيانات محفوظة في متصفحك — صدّرها للنقل لجهاز آخر</small></div>
</div>

<div class="tabs" style="margin-bottom:14px">
  <button class="on" data-v="active" onclick="setView('active')">النشطون</button>
  <button data-v="archived" onclick="setView('archived')">المؤرشفون</button></div>

<div class="toolbar">
  <input id="q" placeholder="بحث بالاسم أو الهاتف أو البريد…" style="min-width:230px" oninput="onQ(this.value)">
  <select class="fsel" onchange="onF('type',this.value)"><option value="">كل الأنواع</option>
   <option>شركة مقاولات</option><option>شركة تطوير عقاري</option><option>جهة حكومية</option><option>مكتب استشاري</option><option>عميل فردي</option></select>
  <select class="fsel" onchange="onF('gov',this.value)"><option value="">كل المحافظات</option>
   <option>الإسكندرية</option><option>القاهرة</option><option>الجيزة</option><option>البحيرة</option><option>الدقهلية</option></select>
  <select class="fsel" onchange="onF('status',this.value)"><option value="">كل الحالات</option>
   <option>نشط</option><option>خامل</option><option>موقوف</option></select>
  <div style="flex:1"></div><span class="muted" id="cnt">0</span></div>

<div id="tblhost"></div>

<div class="notice" style="margin-top:16px">بيانات العملاء تخضع لسياسة الخصوصية — لا تُشارك مع أي مزوّد إلا في سياق طلب تواصل أنشأه العميل بنفسه.</div>
`);

function rowFilter(r){
  if(FILT.type && r.type!==FILT.type) return false;
  if(FILT.gov && r.gov!==FILT.gov) return false;
  if(FILT.status && r.status!==FILT.status) return false;
  if(Q && !((r.name||"")+(r.phone||"")+(r.email||"")+(r.contact||"")).includes(Q)) return false;
  return true;
}
function buildTable(rows){
  return table(["العميل","النوع","مسؤول التواصل","الهاتف","الموقع","طلبات","مغلقة","القيمة","الحالة","الإجراءات"],
   rows.map(r=>[
    userCell(r.name, r.email||"—", (r.name||"؟").slice(0,2)),
    `<span class="chip cy">${r.type||"—"}</span>`, r.contact||"—",
    r.phone?`<code>${r.phone}</code>`:"—", `${r.gov||"—"}${r.city?" — "+r.city:""}`,
    r.leads||0, `<span class="chip ok">${r.closed||0}</span>`, r.value||"—",
    r.status==="موقوف"?'<span class="chip err">موقوف</span>':r.status==="خامل"?'<span class="chip warn">خامل</span>':'<span class="chip ok">نشط</span>',
    CRUD.actions("clients", r.id, VIEW==="archived")]));
}

let VIEW="active", Q="", FILT={};
function refreshTable(){ render(); }
function render(){
  const rows = (VIEW==="archived"?GS.archived(COLL):GS.active(COLL)).filter(rowFilter);
  $("#tblhost").innerHTML = rows.length ? buildTable(rows)
    : `<div class="empty">لا توجد سجلات مطابقة. <button class="btn btn-soft btn-sm" onclick="clearF()">مسح الفلاتر</button></div>`;
  $("#cnt").textContent = rows.length + " سجل";
  $("#uActive").textContent = GS.active(COLL).length;
  $("#uArch").textContent = GS.archived(COLL).length;
  const u = GS.usage();
  const sb=$("#stbar"); if(sb){ sb.querySelector("i").style.width=u.pct+"%"; sb.classList.toggle("hi",u.pct>75);
    $("#stlab").textContent = u.label + " / 5 م.ب"; }
}
function clearF(){ Q=""; FILT={}; $("#q").value=""; $$(".fsel").forEach(s=>s.value=""); render(); }
function setView(v){ VIEW=v; $$(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); render(); }
function onQ(v){ Q=v.trim(); render(); }
function onF(k,v){ FILT[k]=v; render(); }

GS.onChange(render); render();

</script>
</body>
</html>
