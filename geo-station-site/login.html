<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Survsta</title>
<meta name="description" content="تسجيل الدخول إلى منصة Survsta — بوابة الشركاء ومزودي الخدمات ولوحة الإدارة.">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Platform — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrap { max-width: 460px; margin: 40px auto; }
  .auth-card { background: #fff; border: 1px solid var(--bd); border-radius: var(--r); padding: 32px; box-shadow: var(--sh); }
  .auth-card h1 { font-size: 24px; margin-bottom: 8px; }
  .demo-box { margin-top: 24px; padding: 16px; background: #f8fafc; border: 1px dashed var(--bd); border-radius: 12px; }
  .demo-box h4 { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .demo-btn { width: 100%; text-align: start; padding: 9px 12px; border: 1px solid var(--bd); border-radius: 8px; background: #fff; font-size: 13px; margin-bottom: 6px; cursor: pointer; transition: .15s; display: flex; justify-content: space-between; align-items: center; }
  .demo-btn:hover { border-color: var(--cyan); background: #f0fdfa; }
  .auth-alert { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; display: none; }
  .auth-alert.err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
</style>
</head>
<body>
<main id="main">
<section class="sec tight"><div class="wrap">
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="display:flex;align-items:center;margin-bottom:20px;">
        <a href="index.html" class="brand" aria-label="Survsta" style="color:var(--navy)">
          <svg class="survsta-logo" viewBox="0 0 152 36" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="logo-mark">
              <rect width="36" height="36" rx="10" fill="url(#survsta-grad-login)" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.35"/>
              <path d="M12 23.5L6.5 31.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <path d="M18 23.5V31.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              <path d="M24 23.5L29.5 31.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              <path d="M10.5 23.5H25.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              <path d="M13 13.5C13 12.4 13.9 11.5 15 11.5H21C22.1 11.5 23 12.4 23 13.5V23.5H13V13.5Z" fill="#00d2ff" fill-opacity="0.25" stroke="#00d2ff" stroke-width="1.4"/>
              <path d="M9 16.5H27" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="18" cy="16.5" r="4.2" stroke="#0a2033" stroke-width="1.4" fill="#0a2033" fill-opacity="0.3"/>
              <circle cx="18" cy="16.5" r="1.6" fill="#f59e0b"/>
              <circle cx="18" cy="7.5" r="1.6" fill="#00d2ff"/>
              <path d="M18 9.5V11.5" stroke="#00d2ff" stroke-width="1.2" stroke-linecap="round"/>
            </g>
            <text x="45" y="26" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="-0.4" fill="currentColor">Surv<tspan fill="#00d2ff">sta</tspan></text>
            <defs>
              <linearGradient id="survsta-grad-login" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0a2033"/>
                <stop offset="1" stop-color="#12455f"/>
              </linearGradient>
            </defs>
          </svg>
        </a>
      </div>

      <h1>تسجيل الدخول</h1>
      <p class="muted" style="margin-bottom:20px">ادخل إلى حسابك للوصول إلى لوحة المزوّد أو لوحة الإدارة.</p>

      <div id="authAlert" class="auth-alert err"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="field" style="margin-bottom:14px">
          <label>البريد الإلكتروني *</label>
          <input type="email" id="loginEmail" required placeholder="name@company.com" autocomplete="email">
        </div>
        <div class="field" style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label style="margin:0">كلمة المرور *</label>
            <a href="contact.html" style="font-size:12px;color:var(--cyan-d)">نسيت كلمة المرور؟</a>
          </div>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <label class="muted" style="display:flex;gap:8px;align-items:center;margin-bottom:18px;cursor:pointer">
          <input type="checkbox" id="rememberMe" checked> تذكر بيانات الدخول
        </label>

        <button type="submit" id="loginSubmitBtn" class="btn btn-pri btn-block btn-lg">تسجيل الدخول</button>
      </form>

      <div class="demo-box">
        <h4>⚡ حسابات تجريبية سريعة (للمراجعة والتشغيل):</h4>
        <button type="button" class="demo-btn" onclick="quickFill('admin')">
          <span>🛡️ <b>مدير النظام (Admin)</b></span>
          <span style="color:var(--muted);font-size:11px">admin@survsta.com</span>
        </button>
        <button type="button" class="demo-btn" onclick="quickFill('provider')">
          <span>🏢 <b>مزوّد خدمات ومعدات (Provider)</b></span>
          <span style="color:var(--muted);font-size:11px">elite@provider.eg</span>
        </button>
      </div>

      <div class="sep" style="margin:24px 0"></div>
      <div style="text-align:center;font-size:14px">
        <span class="muted">ليس لديك حساب بعد؟</span>
        <a href="register.html" style="color:var(--cyan-d);font-weight:700;margin-inline-start:6px">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>
</div></section>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/supabaseService.js"></script>
<script src="assets/js/authGuard.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountShell("login.html");

function quickFill(role) {
  const emailInput = document.getElementById("loginEmail");
  const passInput = document.getElementById("loginPassword");
  if (role === "admin") {
    emailInput.value = "admin@survsta.com";
    passInput.value = "admin123456";
  } else {
    emailInput.value = "elite@provider.eg";
    passInput.value = "provider123456";
  }
  toast("تمت تعبئة بيانات الدخول لـ: " + (role === "admin" ? "مدير النظام" : "مزوّد الخدمات"));
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  const alertEl = document.getElementById("authAlert");
  const btn = document.getElementById("loginSubmitBtn");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  alertEl.style.display = "none";
  alertEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "جاري التحقق من الحساب…";

  try {
    const res = await AuthGuard.signIn(email, password);
    if (res.error) {
      alertEl.textContent = res.error.message || "تعذر تسجيل الدخول. يرجى التأكد من البريد الإلكتروني وكلمة المرور.";
      alertEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "تسجيل الدخول";
      toast("❌ " + (res.error.message || "فشل الدخول"));
      return;
    }

    toast("✅ تم تسجيل الدخول بنجاح! جاري التوجيه…");
    const user = res.user;
    const redirectParam = new URLSearchParams(location.search).get("redirect");
    const isAdm = user && (user.role === "admin" || user.role === "super_admin");
    const target = redirectParam ? decodeURIComponent(redirectParam) : (isAdm ? "a-dashboard.html" : "p-dashboard.html");

    setTimeout(() => {
      location.href = target;
    }, 500);
  } catch (err) {
    alertEl.textContent = "حدث خطأ غير متوقع: " + err.message;
    alertEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
  }
}
</script>
</body>
</html>
