<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الأجهزة | Survsta</title>
<meta name="description" content="إدارة الأجهزة">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=3.6">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=3.6"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("admin", "a-equipment.html", "إدارة الأجهزة", `<a href="a-dashboard.html">لوحة الإدارة</a> / <b>الأجهزة</b>`);

const COLL="equipment";
setContent(`
<div class="pagehead"><div><h2>إدارة إدراجات الأجهزة</h2>
  <p>إضافة وتعديل وحذف الأجهزة المعروضة للبيع والإيجار، مع ضبط حالة المعايرة لكل جهاز.</p></div>
  <div class="rowf">${CRUD.addBtn("equipment","إضافة جهاز")}
   <button class="btn btn-soft" onclick="GS.exportCSV('equipment')&&toast('⬇ تم تصدير CSV')">⬇ تصدير</button>
   <a href="equipment.html" target="_blank" class="btn btn-soft">👁️ عرض في السوق</a></div></div>

<div class="grid g5" style="margin-bottom:16px">
  <div class="kpi"><div class="ic">📡</div><div><div class="lab">إدراجات منشورة</div><div class="n" id="uActive">0</div></div></div>
  <div class="kpi"><div class="ic">📦</div><div><div class="lab">مؤرشفة</div><div class="n" id="uArch">0</div></div></div>
  ${kpi("معايرة سارية","5","","flat","✅")}
  ${kpi("معايرة منتهية","2","لا تُعرض كسارية","dn","⚠️")}
  <div class="card" style="padding:14px"><div class="rowb"><span class="muted" style="font-size:12.5px">التخزين</span>
    <b id="stlab" style="font-size:12.5px">—</b></div>
    <div class="storagebar" id="stbar" style="margin-top:8px"><i style="width:0%"></i></div></div>
</div>

<div class="tabs" style="margin-bottom:14px">
  <button class="on" data-v="active" onclick="setView('active')">المنشورة</button>
  <button data-v="archived" onclick="setView('archived')">المؤرشفة</button></div>

<div class="toolbar"><input id="q" placeholder="بحث بالجهاز أو المالك…" style="min-width:220px" oninput="onQ(this.value)">
  <select class="fsel" onchange="onF('cat',this.value)"><option value="">كل الفئات</option>
   <option>Total Station</option><option>GNSS / RTK</option><option>Level</option>
   <option>Laser Scanner</option><option>Drone</option><option>ملحقات</option></select>
  <select class="fsel" onchange="onF('brand',this.value)"><option value="">كل العلامات</option>
   <option>Leica</option><option>Topcon</option><option>Trimble</option><option>Sokkia</option><option>South</option></select>
  <select class="fsel" onchange="onF('calib',this.value)"><option value="">كل حالات المعايرة</option>
   <option>سارية</option><option>منتهية</option><option>غير مُدرجة</option></select>
  <div style="flex:1"></div><span class="muted" id="cnt">0</span></div>

<div id="tblhost"></div>

<div class="notice" style="margin-top:16px">سياسة المعايرة: لا يُعرض سجل معايرة منتهٍ على أنه سارٍ. الأجهزة بلا سجل تظهر بوسم «غير مُدرجة» صراحةً للعميل.</div>
`);

function rowFilter(r){
  if(FILT.cat && r.cat!==FILT.cat) return false;
  if(FILT.brand && r.brand!==FILT.brand) return false;
  if(FILT.calib && r.calib!==FILT.calib) return false;
  if(Q && !((r.name||"")+(r.provider||"")+(r.brand||"")).includes(Q)) return false;
  return true;
}
function calChip(c){
  if(c==="سارية") return '<span class="chip ok">سارية</span>';
  if(c==="منتهية") return '<span class="chip err">منتهية</span>';
  return '<span class="chip warn">غير مُدرجة</span>';
}
function buildTable(rows){
  return table(["الجهاز","العلامة","الفئة","العرض","السعر","المالك","المعايرة","الإجراءات"],
   rows.map(r=>[
    `<div class="who"><div class="av" style="background-image:url('${r.img||""}');background-size:cover;border-radius:9px">${r.img?"":"📡"}</div>
      <div><b>${r.name||"—"}</b><small class="muted">${r.cond||""} ${r.year?"• "+r.year:""}</small></div></div>`,
    `<span class="chip">${r.brand||"—"}</span>`, r.cat||"—",
    `<span class="chip cy">${r.mode||"—"}</span>`,
    r.price?`<b>${num(r.price)}</b> <small class="muted">${r.unit||"ج.م"}</small>`:"—",
    r.provider||"—", calChip(r.calib),
    CRUD.actions("equipment", r.id, VIEW==="archived")]));
}

let VIEW="active", Q="", FILT={};
function refreshTable(){ render(); }
function render(){
  const rows = (VIEW==="archived"?GS.archived(COLL):GS.active(COLL)).filter(rowFilter);
  $("#tblhost").innerHTML = rows.length ? buildTable(rows)
    : `<div class="empty">لا توجد سجلات مطابقة. <button class="btn btn-soft btn-sm" onclick="clearF()">مسح الفلاتر</button></div>`;
  $("#cnt").textContent = rows.length + " سجل";
  const a=$("#uActive"); if(a) a.textContent = GS.active(COLL).length;
  const b=$("#uArch");  if(b) b.textContent = GS.archived(COLL).length;
  const sb=$("#stbar"); if(sb){ const u=GS.usage(); sb.querySelector("i").style.width=u.pct+"%";
    sb.classList.toggle("hi",u.pct>75); $("#stlab").textContent = u.label+" / 5 م.ب"; }
}
function clearF(){ Q=""; FILT={}; const q=$("#q"); if(q)q.value=""; $$(".fsel").forEach(s=>s.value=""); render(); }
function setView(v){ VIEW=v; $$(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); render(); }
function onQ(v){ Q=v.trim(); render(); }
function onF(k,v){ FILT[k]=v; render(); }
GS.onChange(render);

render();

</script>
</body>
</html>
