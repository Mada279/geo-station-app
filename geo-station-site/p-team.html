<script>
mountPortal("provider", "p-team.html", "الفريق والصلاحيات", `<a href="p-dashboard.html">بوابة المزوّد</a> / <b>الفريق والصلاحيات</b>`);

const TEAM=[["م. أحمد النجار","ahmed@elite-survey.eg","مدير الحساب","نشط","2024-03-11"],
 ["م. سارة منير","sara@elite-survey.eg","موظف مبيعات","نشط","2025-02-08"],
 ["م. خالد رشدي","khaled@elite-survey.eg","مسؤول ميداني","نشط","2025-07-19"],
 ["أ. دينا حسن","dina@elite-survey.eg","محاسب","بانتظار القبول","2026-09-01"]];
const PERMS=[["عرض الطلبات",1,1,1,0],["الرد على الطلبات وتحديث الحالة",1,1,0,0],["إضافة وتعديل الأجهزة",1,0,1,0],
 ["تعديل ملف الجهة",1,0,0,0],["نشر الوظائف",1,0,0,0],["عرض التحليلات",1,1,0,1],
 ["إدارة الفريق والصلاحيات",1,0,0,0],["إدارة الظهور المميّز",1,0,0,0]];
const ROLES=["مدير الحساب","موظف مبيعات","مسؤول ميداني","محاسب"];
setContent(`
<div class="pagehead"><div><h2>الفريق والصلاحيات</h2>
  <p>أضف زملاءك بصلاحيات محدودة — كل إجراء يُنسب لصاحبه ويظهر في سجل نشاط الحساب.</p></div>
  <button class="btn btn-pri" onclick="inviteForm()">＋ دعوة عضو</button></div>

${table(["العضو","الدور","تاريخ الانضمام","الحالة",""],
 TEAM.map(([n,e,r,s,d])=>[userCell(n,e),`<span class="chip cy">${r}</span>`,`<span class="muted">${d}</span>`,
   st(s==="نشط"?"نشط":"قيد المراجعة"),
   `<div class="acts"><button class="btn btn-soft btn-sm" onclick="toast('تعديل صلاحيات ${n}')">الصلاحيات</button>
    ${r!=="مدير الحساب"?`<button class="btn btn-err btn-sm" onclick="toast('تم إلغاء وصول العضو')">إلغاء الوصول</button>`:""}</div>`]))}

<div class="card" style="margin-top:18px"><h3>مصفوفة الصلاحيات</h3>
 <p class="muted" style="margin-top:6px">الصلاحيات مبنية على الأدوار — يمكن تخصيصها لكل عضو عند الحاجة.</p>
 <div style="margin-top:14px">${table(["الصلاحية",...ROLES],
   PERMS.map(p=>[`<b style="font-size:13.5px">${p[0]}</b>`,...p.slice(1).map(v=>v?'<span class="chip ok">✔</span>':'<span class="muted">—</span>')]))}</div>
</div>
`);
function inviteForm(){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>دعوة عضو للفريق</h3>
  <p class="muted">تصل دعوة على البريد، ويصبح العضو نشطًا بعد قبولها.</p>
  <div class="formgrid" style="margin-top:14px">
   <div class="field"><label>الاسم *</label><input></div>
   <div class="field"><label>البريد الإلكتروني *</label><input type="email"></div>
   <div class="field"><label>الدور *</label><select>${ROLES.map(r=>`<option>${r}</option>`).join("")}</select></div>
   <div class="field"><label>رقم الهاتف</label><input></div>
   <div class="field full"><label>رسالة الدعوة</label><textarea rows="2" placeholder="اختياري"></textarea></div>
  </div>
  <button class="btn btn-pri btn-block" style="margin-top:14px" onclick="closeModal();toast('📨 تم إرسال الدعوة')">إرسال الدعوة</button>`);
}

</script>
</body>
</html>
