<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل الدورة | Geo Station</title>
<meta name="description" content="محتوى الدورة التدريبية والمخرجات وجهة التنفيذ.">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Geo Station Platform — Concept, UX/UI & Platform Architecture by Eng. Mohamed Farag — CoreviaZone -->
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="main">
<section class="sec tight"><div class="wrap">
  <div class="muted" id="crumb"></div>
  <div class="layout rev" style="margin-top:16px"><div id="body"></div><aside id="aside"></aside></div>
  <div class="sechead" style="margin-top:44px"><div><h2>دورات أخرى قد تهمك</h2></div></div>
  <div class="grid g3" id="more"></div>
</div></section><div id="cta"></div>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountShell("academy.html");

const c = COURSES.find(x=>x.slug===qs("slug")) || COURSES[0];
document.title=c.t+" | Geo Station";
$("#crumb").innerHTML=`<a href="index.html">الرئيسية</a> / <a href="academy.html">Academy</a> / <b>${c.t}</b>`;
$("#body").innerHTML=`
 <div class="panel"><img src="${c.img}" style="width:100%;height:300px;object-fit:cover;border-radius:14px" alt="${c.t}">
  <h1 style="font-size:27px;margin-top:16px">${c.t}</h1>
  <div class="muted" style="margin-top:6px">${c.center} • ${c.hours} • مستوى ${c.lvl}</div>
  <p style="margin-top:12px;color:var(--ink2);font-size:15.5px">${c.d}</p>
  <div class="sep"></div>
  <h3 style="font-size:19px">محتوى الدورة</h3>
  <div style="margin-top:12px">${["مقدمة وأساسيات نظرية مختصرة","الإعداد والتجهيز وضبط الأدوات","التطبيق العملي — الجزء الأول","التطبيق العملي — الجزء الثاني","معالجة البيانات وإخراج النتائج","مشروع ختامي ومناقشة"]
    .map((t,i)=>`<div class="card" style="padding:13px;margin-bottom:9px"><div class="rowb"><div class="rowf">
      <span class="chip solid">${i+1}</span><b>${t}</b></div><span class="muted">${2+i%2} ساعة</span></div></div>`).join("")}</div>
  <div class="sep"></div>
  <h3 style="font-size:19px">لمن هذه الدورة؟</h3>
  <ul style="margin-top:10px;color:var(--ink2)"><li>مسّاحون وحديثو التخرج في المساحة والهندسة المدنية</li>
   <li>فنيون يعملون في مواقع التنفيذ ويريدون رفع كفاءتهم</li><li>مهتمون بالتحول لمجال الجيوماتكس وGIS</li></ul>
  <div class="notice" style="margin-top:16px">التسجيل والتنفيذ يتمّان لدى مركز التدريب؛ Geo Station توفّر طبقة الاكتشاف والتوجيه فقط.</div>
 </div>`;
$("#aside").innerHTML=`<div class="panel sticky">
  <div style="font-size:28px;font-weight:900">${c.price}</div><div class="muted">شامل المادة العلمية والتدريب العملي</div>
  <button class="btn btn-pri btn-block btn-lg" style="margin-top:14px" onclick="openModal('enroll','${c.t}')">طلب التحاق بالدورة</button>
  <button class="btn btn-soft btn-block" style="margin-top:9px" onclick="toast('تم حفظ الدورة')">♡ حفظ الدورة</button>
  <div class="sep"></div>
  <table class="spec"><tbody><tr><th>المدة</th><td>${c.hours}</td></tr><tr><th>المستوى</th><td>${c.lvl}</td></tr>
   <tr><th>جهة التنفيذ</th><td>${c.center}</td></tr><tr><th>الشهادة</th><td>شهادة حضور من المركز</td></tr>
   <tr><th>مكان التدريب</th><td>مقر المركز + تدريب ميداني</td></tr></tbody></table></div>`;
$("#more").innerHTML=COURSES.filter(x=>x.slug!==c.slug).slice(0,3).map(courseCard).join("");
$("#cta").innerHTML=ctaBand();
</script>
</body>
</html>
