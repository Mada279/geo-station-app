<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التقييمات | Survsta</title>
<meta name="description" content="التقييمات">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=3.2">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=3.2"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("provider", "p-reviews.html", "التقييمات", `<a href="p-dashboard.html">بوابة المزوّد</a> / <b>التقييمات</b>`);

const REV=[["م. طارق عبد الحميد",5,"دقة ممتازة في الرفع وتسليم في الموعد المتفق عليه، والتعامل مهني جدًا مع الملاحظات.","2026-08-25","منشور",1],
 ["شركة أوركيد للتطوير",5,"تعاملنا معهم في مشروعين، الالتزام والدقة على مستوى عالٍ.","2026-08-14","منشور",1],
 ["م. منى فؤاد",4,"خدمة جيدة، كان في تأخير بسيط بسبب ظروف الموقع لكن النتيجة النهائية ممتازة.","2026-08-02","منشور",0],
 ["مقاولات الدلتا",3,"الشغل كويس بس التواصل كان بطيء في البداية.","2026-07-21","منشور",1],
 ["مستخدم غير معروف",1,"تقييم بدون تفاصيل ومصدره مشبوه.","2026-07-09","قيد المراجعة",0]];
setContent(`
<div class="pagehead"><div><h2>تقييمات العملاء</h2>
  <p>التقييمات مرتبطة بتفاعل حقيقي. لا يمكنك حذف تقييم، لكن يمكنك الرد عليه أو الإبلاغ عنه للمراجعة.</p></div></div>

<div class="grid g4" style="margin-bottom:16px">
  ${kpi("التقييم العام","4.8 ★","من 64 تقييم","up","⭐")}
  ${kpi("تقييمات هذا الشهر","6","▲ 2","up","🆕")}
  ${kpi("نسبة الرد على التقييمات","60%","الرد يرفع الثقة","warn","💬")}
  ${kpi("تقييمات قيد المراجعة","1","مُبلَّغ عنها","flat","🚩")}
</div>

<div class="grid g2">
 <div class="card"><h3>توزيع التقييمات</h3>
  <div style="margin-top:12px">${[[5,48],[4,11],[3,3],[2,1],[1,1]].map(([s,n])=>
    `<div class="rowb" style="margin-bottom:9px"><span style="width:52px" class="muted">${s} ★</span>
     <div class="bar" style="flex:1"><i style="width:${n/64*100}%"></i></div><b style="width:34px;text-align:end">${n}</b></div>`).join("")}</div>
 </div>
 <div class="card"><h3>متوسط المحاور</h3>
  <div style="margin-top:12px">${[["جودة التنفيذ",4.6],["الالتزام بالمواعيد",4.3],["التواصل والاستجابة",4.5],["القيمة مقابل السعر",4.05]]
    .map(([t,v])=>barRow(t+" — "+v,Math.round(v/5*100),100)).join("")}</div>
 </div>
</div>

<div class="card" style="margin-top:16px"><h3>كل التقييمات</h3>
 <div style="margin-top:14px">
 ${REV.map(([n,s,c,d,status,replied])=>`<div style="padding:14px 0;border-bottom:1px solid var(--bd)">
   <div class="rowb"><div class="rowf">${userCell(n,d)}<span style="color:#f0a92c">${"★".repeat(s)}${"☆".repeat(5-s)}</span></div>
     <div class="rowf">${st(status)}
       ${!replied?`<button class="btn btn-pri btn-sm" onclick="replyForm('${n}')">💬 رد</button>`:'<span class="chip ok">✔ تم الرد</span>'}
       <button class="btn btn-soft btn-sm" onclick="reportForm('${n}')">🚩 إبلاغ</button></div></div>
   <p style="margin-top:9px">${c}</p>
   ${replied?`<div style="margin-top:10px;padding:11px;background:#f4f9fc;border-radius:10px;border-inline-start:3px solid var(--cyan)">
     <b style="font-size:13.5px">ردّك:</b><p class="muted" style="margin-top:4px">شكرًا لثقتكم، سعدنا بالتعاون ونتطلع لخدمتكم في مشروعات قادمة.</p></div>`:""}
  </div>`).join("")}</div>
</div>

<div class="notice" style="margin-top:16px">لا يمكن للمزوّد حذف أو تعديل أي تقييم. البلاغات تُراجع من إدارة المنصة، وكل قرار يُسجَّل في سجل التدقيق.</div>
`);
function replyForm(n){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>الرد على تقييم ${n}</h3>
  <p class="muted">ردّك يظهر علنًا أسفل التقييم — حافظ على الطابع المهني.</p>
  <div class="field" style="margin-top:14px"><label>نص الرد</label><textarea rows="4" placeholder="اشكر العميل وعالج أي ملاحظة بموضوعية"></textarea></div>
  <button class="btn btn-pri btn-block" style="margin-top:14px" onclick="closeModal();toast('✅ تم نشر ردّك')">نشر الرد</button>`);
}
function reportForm(n){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>الإبلاغ عن تقييم</h3>
  <div class="field" style="margin-top:14px"><label>سبب البلاغ</label>
   <select><option>تقييم بدون تعامل حقيقي</option><option>محتوى مسيء</option><option>منافس أو حساب مزيف</option><option>معلومات غير صحيحة</option></select></div>
  <div class="field" style="margin-top:12px"><label>الأدلة أو التوضيح</label><textarea rows="3"></textarea></div>
  <button class="btn btn-pri btn-block" style="margin-top:14px" onclick="closeModal();toast('تم إرسال البلاغ للإدارة')">إرسال البلاغ</button>`);
}

</script>
</body>
</html>
