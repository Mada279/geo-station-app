<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المزوّدين | Survsta</title>
<meta name="description" content="إدارة المزوّدين">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=2.4">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=2.4"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("admin", "a-providers.html", "إدارة المزوّدين", `<a href="a-dashboard.html">لوحة الإدارة</a> / <b>المزوّدون</b>`);

const COLL="providers";
setContent(`
<div class="pagehead"><div><h2>إدارة المزوّدين</h2>
  <p>إضافة وتعديل وأرشفة وحذف أي جهة — التغييرات تظهر فورًا في الدليل والبحث والخريطة على الموقع العام.</p></div>
  <div class="rowf">${CRUD.addBtn("providers","إضافة مزوّد")}
   <button class="btn btn-soft" onclick="GS.exportCSV('providers')&&toast('⬇ تم تصدير CSV')">⬇ تصدير</button>
   <a href="directory.html" target="_blank" class="btn btn-soft">👁️ عرض في الموقع</a></div></div>

<div class="grid g5" style="margin-bottom:16px">
  <div class="kpi"><div class="ic">🏢</div><div><div class="lab">مزوّدون منشورون</div><div class="n" id="uActive">0</div></div></div>
  <div class="kpi"><div class="ic">📦</div><div><div class="lab">مؤرشفون</div><div class="n" id="uArch">0</div></div></div>
  ${kpi("موثّقون بالكامل","6","▲ 2","up","🛡️")}
  ${kpi("ظهور مميّز","3","موسوم دائمًا","flat","⭐")}
  <div class="card" style="padding:14px"><div class="rowb"><span class="muted" style="font-size:12.5px">التخزين</span>
    <b id="stlab" style="font-size:12.5px">—</b></div>
    <div class="storagebar" id="stbar" style="margin-top:8px"><i style="width:0%"></i></div></div>
</div>

<div class="tabs" style="margin-bottom:14px">
  <button class="on" data-v="active" onclick="setView('active')">المنشورون</button>
  <button data-v="archived" onclick="setView('archived')">المؤرشفون</button></div>

<div class="toolbar"><input id="q" placeholder="بحث بالاسم أو المدينة…" style="min-width:220px" oninput="onQ(this.value)">
  <select class="fsel" onchange="onF('type',this.value)"><option value="">كل الأنواع</option>
   <option>مكتب مساحة</option><option>شركة مساحة</option><option>مورد أجهزة</option>
   <option>مركز معايرة</option><option>مركز تدريب</option><option>مسّاح مستقل</option></select>
  <select class="fsel" onchange="onF('gov',this.value)"><option value="">كل المحافظات</option>
   <option>الإسكندرية</option><option>القاهرة</option><option>الجيزة</option><option>البحيرة</option><option>مطروح</option></select>
  <div style="flex:1"></div><span class="muted" id="cnt">0</span></div>

<div id="tblhost"></div>

<div class="notice" style="margin-top:16px">شارات التوثيق تُمنح بأدلة مراجَعة فعليًا ولا تعني اعتمادًا فنيًا. الظهور المميّز موسوم دائمًا ولا يؤثر على التقييم أو مستوى التوثيق.</div>
`);

function rowFilter(r){
  if(FILT.type && r.type!==FILT.type) return false;
  if(FILT.gov && r.gov!==FILT.gov) return false;
  if(Q && !((r.name||"")+(r.city||"")+(r.gov||"")).includes(Q)) return false;
  return true;
}
function buildTable(rows){
  return table(["المزوّد","النوع","الموقع","التقييم","التوثيق","مميّز","الإجراءات"],
   rows.map(r=>[
    `<div class="who"><div class="av" style="background-image:url('${r.img||""}');background-size:cover">${r.img?"":(r.name||"؟").slice(0,2)}</div>
      <div><b>${r.name||"—"}</b><small class="muted">${r.svc?r.svc.slice(0,2).join("، "):"—"}</small></div></div>`,
    `<span class="chip cy">${r.type||"—"}</span>`,
    `${r.gov||"—"}${r.city?" — "+r.city:""}`,
    r.rate?`<span class="stars">★</span> <b>${r.rate}</b> <small class="muted">(${r.reviews||0})</small>`:"—",
    (r.ver&&r.ver.length)?r.ver.map(v=>`<span class="chip ok">${v}</span>`).join(""):'<span class="chip">بلا شارات</span>',
    r.featured?'<span class="chip spon">مميّز</span>':'<span class="muted">—</span>',
    CRUD.actions("providers", r.id, VIEW==="archived")]));
}

let VIEW="active", Q="", FILT={};
function refreshTable(){ render(); }
function render(){
  const rows = (VIEW==="archived"?GS.archived(COLL):GS.active(COLL)).filter(rowFilter);
  $("#tblhost").innerHTML = rows.length ? buildTable(rows)
    : `<div class="empty">لا توجد سجلات مطابقة. <button class="btn btn-soft btn-sm" onclick="clearF()">مسح الفلاتر</button></div>`;
  $("#cnt").textContent = rows.length + " سجل";
  const a=$("#uActive"); if(a) a.textContent = GS.active(COLL).length;
  const b=$("#uArch");  if(b) b.textContent = GS.archived(COLL).length;
  const sb=$("#stbar"); if(sb){ const u=GS.usage(); sb.querySelector("i").style.width=u.pct+"%";
    sb.classList.toggle("hi",u.pct>75); $("#stlab").textContent = u.label+" / 5 م.ب"; }
}
function clearF(){ Q=""; FILT={}; const q=$("#q"); if(q)q.value=""; $$(".fsel").forEach(s=>s.value=""); render(); }
function setView(v){ VIEW=v; $$(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); render(); }
function onQ(v){ Q=v.trim(); render(); }
function onF(k,v){ FILT[k]=v; render(); }
GS.onChange(render);

render();

</script>
</body>
</html>
