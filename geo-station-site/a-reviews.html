<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مراجعة التقييمات | Survsta</title>
<meta name="description" content="مراجعة التقييمات">
<meta name="robots" content="noindex">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Portal — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/portal.css?v=2.7">
</head>
<body>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/portal.js?v=2.7"></script>
<script src="assets/js/crud.js"></script>
<script>
mountPortal("admin", "a-reviews.html", "مراجعة التقييمات", `<a href="a-dashboard.html">لوحة الإدارة</a> / <b>مراجعة التقييمات</b>`);

const RV=[["RV-903","مستخدم غير معروف","مكتب النخبة",1,"تقييم بدون تفاصيل ومصدره مشبوه.","2026-09-02","مُبلَّغ عنه","لا يوجد طلب تواصل مرتبط"],
 ["RV-899","حساب جديد","جيو تك للتوريدات",5,"أفضل مكان على الإطلاق!!!","2026-09-01","مُبلَّغ عنه","نمط تقييم مشبوه — 4 تقييمات بنفس اليوم"],
 ["RV-894","م. طارق عبد الحميد","مكتب النخبة",5,"دقة ممتازة في الرفع وتسليم في الموعد المتفق عليه.","2026-08-25","منشور","—"],
 ["RV-890","مقاولات الدلتا","دلتا جيوماتكس",3,"الشغل كويس بس التواصل كان بطيء في البداية.","2026-08-21","منشور","—"],
 ["RV-885","م. منى فؤاد","مركز الدقة",4,"خدمة جيدة والنتيجة النهائية ممتازة.","2026-08-14","منشور","—"]];
setContent(`
<div class="pagehead"><div><h2>مراجعة التقييمات</h2>
  <p>التقييم يجب أن يستند لتفاعل حقيقي. المزوّد لا يستطيع حذف أي تقييم، والإدارة تتدخل فقط بقرار موثّق.</p></div></div>

<div class="grid g4" style="margin-bottom:16px">
  ${kpi("مُبلَّغ عنها","2","تحتاج قرار","dn","🚩")}
  ${kpi("تقييمات هذا الشهر","184","▲ 19%","up","⭐")}
  ${kpi("بدون طلب مرتبط","7","مؤشر خطورة","dn","🔗")}
  ${kpi("تم إخفاؤها هذا الشهر","4","بقرار موثّق","flat","🙈")}
</div>

<div class="toolbar"><select><option>كل الحالات</option><option>مُبلَّغ عنه</option><option>منشور</option><option>مخفي</option></select>
 <select><option>كل التقييمات</option><option>1-2 نجوم</option><option>5 نجوم</option></select>
 <select><option>كل المؤشرات</option><option>بدون طلب مرتبط</option><option>نمط مشبوه</option></select>
 <div style="flex:1"></div><span class="muted">${RV.length} تقييم</span></div>

${table(["الرقم","المُقيِّم","الجهة","التقييم","النص","مؤشر الخطورة","الحالة","الإجراء"],
 RV.map(r=>[`<code>${r[0]}</code>`,userCell(r[1],r[5]),r[2],
   `<span style="color:#f0a92c">${"★".repeat(r[3])}${"☆".repeat(5-r[3])}</span>`,
   `<span style="font-size:13px">${r[4].slice(0,44)}…</span>`,
   r[8]==="—"?'<span class="muted">—</span>':`<span class="chip err">${r[8]}</span>`,
   r[6]==="منشور"?st("منشور"):'<span class="chip warn">مُبلَّغ عنه</span>',
   `<button class="btn btn-pri btn-sm" onclick="modReview('${r[0]}','${r[4]}','${r[8]}')">فحص</button>`]))}
`);
function modReview(id,txt,risk){
 openModal(`<button class="x" onclick="closeModal()">✕</button><h3>فحص تقييم ${id}</h3>
  <div class="card" style="margin-top:12px;background:#f9fcfd"><p>${txt}</p></div>
  <div class="sep"></div>
  ${table([],[["<b>مؤشر الخطورة</b>",risk==="—"?'<span class="chip ok">لا يوجد</span>':`<span class="chip err">${risk}</span>`],
    ["<b>طلب تواصل مرتبط</b>",risk.includes("لا يوجد")?'<span class="chip err">غير موجود</span>':'<span class="chip ok">LD-1030</span>'],
    ["<b>عمر حساب المُقيِّم</b>","3 أيام"],["<b>تقييمات سابقة للمستخدم</b>","1"]])}
  <div class="field" style="margin-top:14px"><label>سبب القرار *</label>
   <select><option>تقييم بدون تعامل موثّق</option><option>محتوى مسيء أو مخالف</option><option>حساب مزيف أو منافس</option><option>لا مخالفة — إبقاء منشورًا</option></select></div>
  <div class="field" style="margin-top:12px"><label>ملاحظة داخلية</label><textarea rows="2"></textarea></div>
  <div class="rowf" style="margin-top:14px;flex-wrap:wrap">
   <button class="btn btn-ok" onclick="closeModal();toast('✔ ${id}: إبقاء التقييم منشورًا')">إبقاء منشورًا</button>
   <button class="btn btn-org" onclick="closeModal();toast('🙈 ${id}: تم إخفاء التقييم — سُجِّل القرار')">إخفاء</button>
   <button class="btn btn-err" onclick="closeModal();toast('⛔ ${id}: تم الحذف وتعليم الحساب')">حذف وتعليم الحساب</button></div>`);
}

</script>
</body>
</html>
