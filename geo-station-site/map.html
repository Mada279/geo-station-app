<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الخريطة التفاعلية | Survsta</title>
<meta name="description" content="استكشف مكاتب وشركات المساحة والأجهزة على الخريطة حسب موقعك ونطاق الخدمة.">
<meta name="author" content="Eng. Mohamed Farag — CoreviaZone">
<!-- Survsta Platform — All Rights Reserved -->
<link rel="stylesheet" href="assets/css/style.css?v=3.3">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<main id="main">
<section class="sec tight dark"><div class="wrap">
  <div class="muted">الرئيسية / الخريطة</div>
  <div class="sechead" style="margin-top:10px"><div><h2>مستكشف الخريطة</h2>
    <p>نفس حالة البحث والفلاتر تُستخدم في القائمة والخريطة — اضغط أي علامة لعرض تفاصيل الجهة.</p></div>
    <button class="btn btn-pri" onclick="nearMe()">📍 بالقرب مني</button></div>
  <div class="layout">
    <aside class="panel sticky">
      <div class="fgroup"><h4>بحث</h4><input type="text" id="f-q" placeholder="اسم أو خدمة"></div>
      <div class="fgroup"><h4>نوع الجهة</h4><select id="f-cat"><option value="">الكل</option></select></div>
      <div class="fgroup"><h4>المحافظة</h4><select id="f-gov"><option value="">الكل</option></select></div>
      <div class="fgroup"><h4>نطاق البحث</h4><select id="f-rad"><option>10 كم</option><option selected>25 كم</option><option>50 كم</option><option>100 كم</option></select></div>
      <div class="fgroup"><h4>عرض</h4><label><input type="checkbox" checked> مكاتب وشركات</label>
        <label><input type="checkbox"> أجهزة متاحة</label><label><input type="checkbox"> مراكز معايرة</label></div>
      <select id="f-sort" class="hidden"></select>
      <button class="btn btn-soft btn-block btn-sm" onclick="clearF()">مسح الفلاتر</button>
    </aside>
    <div><div id="map"></div><div class="grid g3" style="margin-top:18px" id="list"></div></div>
  </div>
</div></section><div id="cta"></div>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js?v=3.3"></script>
<script>
mountShell("map.html");

$("#f-cat").innerHTML += PROVIDER_TYPES.map(t=>`<option value="${t.slug}">${t.name}</option>`).join("");
$("#f-gov").innerHTML += GOVS.map(g=>`<option>${g}</option>`).join("");

let leafletMap = null;
let geoJsonLayer = null;
let userMarker = null;

function initLeafletMap(){
  if(typeof L === "undefined") return null;
  if(leafletMap) return leafletMap;
  const container = document.getElementById("map");
  if(!container) return null;
  leafletMap = L.map("map", { scrollWheelZoom: false }).setView([30.5, 31.0], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(leafletMap);
  return leafletMap;
}

function clearF(){
  ["f-q","f-cat","f-gov"].forEach(i=>$("#"+i).value="");
  if(userMarker && leafletMap){ leafletMap.removeLayer(userMarker); userMarker=null; }
  draw();
}

function nearMe(){
  if (navigator.geolocation) {
    toast("📍 جارٍ تحديد موقعك الجغرافي...");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        toast("📍 تم تحديد موقعك الجغرافي بنجاح");
        const lMap = initLeafletMap();
        if (lMap) {
          const radKm = parseInt($("#f-rad").value) || 25;
          lMap.setView([latitude, longitude], 12);
          if (userMarker) lMap.removeLayer(userMarker);
          userMarker = L.circle([latitude, longitude], {
            color: '#00d2ff',
            fillColor: '#00d2ff',
            fillOpacity: 0.18,
            radius: radKm * 1000
          }).addTo(lMap);
          userMarker.bindPopup("<b>📍 موقعك الحالي</b><br><small>نطاق البحث: " + radKm + " كم</small>").openPopup();
        }
      },
      (err) => {
        console.warn("Geolocation fallback:", err);
        $("#f-gov").value = "الإسكندرية";
        draw();
        toast("📍 تعذر تحديد موقعك بدقة — تم تعيين المحافظة: الإسكندرية (" + $("#f-rad").value + ")");
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    $("#f-gov").value = "الإسكندرية";
    draw();
    toast("📍 خاصية تحديد الموقع غير مدعومة");
  }
}

function draw(){
  const r = filterProviders(readFilters());
  const lMap = initLeafletMap();
  
  if (lMap) {
    if (geoJsonLayer) lMap.removeLayer(geoJsonLayer);
    const geojson = window.providersToGeoJSON ? window.providersToGeoJSON(r) : {type:"FeatureCollection", features:[]};
    
    geoJsonLayer = L.geoJSON(geojson, {
      pointToLayer: (feature, latlng) => {
        const p = feature.properties;
        const icon = L.divIcon({
          className: "custom-leaflet-marker",
          html: `<button class="custom-map-marker">${p.name.split(" ").slice(0,2).join(" ")} • ${p.rate}★</button>`,
          iconSize: [120, 30],
          iconAnchor: [60, 15]
        });
        return L.marker(latlng, { icon: icon });
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <div class="map-popup-card">
            <h4>${p.name}</h4>
            <p>📍 ${p.gov} — ${p.city} • ${p.rate}★ (${p.reviews} تقييم)</p>
            <span class="chip">${p.type}</span>
            <a href="provider.html?slug=${p.slug}" class="btn btn-pri">عرض تفاصيل الجهة ←</a>
          </div>
        `);
      }
    }).addTo(lMap);

    if (r.length > 0 && !userMarker) {
      const bounds = geoJsonLayer.getBounds();
      if (bounds.isValid()) {
        lMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
      }
    }
  } else {
    $("#map").innerHTML = `<div class="mapbox">
      ${r.map(p=>`<button class="pin" style="top:${p.y}%;inset-inline-end:${p.x}%" onclick="location.href='provider.html?slug=${p.slug}'">${p.name.split(" ").slice(0,2).join(" ")} • ${p.rate}★</button>`).join("")}
      <div class="maplegend"><b>${r.length}</b> جهة داخل النطاق<br><span class="muted">الترتيب: صلة + مسافة + توثيق</span></div></div>`;
  }
  
  $("#list").innerHTML = r.slice(0,6).map(providerCard).join("") || `<div class="empty">لا توجد جهات في هذا النطاق.</div>`;
}

["f-q","f-cat","f-gov","f-rad"].forEach(i=>{$("#"+i).addEventListener("input",draw);$("#"+i).addEventListener("change",draw)});
draw(); $("#cta").innerHTML=ctaBand();
</script>
</body>
</html>
